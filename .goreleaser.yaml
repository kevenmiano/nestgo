# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: nestgo

builds:
  - id: nestgo
    main: ./cmd/nestgo
    binary: nestgo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kevenmiano/nestgo/internal/cli.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: nestgo-archives
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git

release:
  mode: keep-existing
