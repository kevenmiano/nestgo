name: Format diagnostics v2 (temporary)
on:
  push:
    branches: [feat/diagnostics-cold-start-and-scale]
    paths: ['.github/workflows/format-diagnostics-v2-temporary.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/diagnostics-cold-start-and-scale
      - name: Apply gofmt
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w diagnostics/process.go diagnostics/process_test.go diagnostics/report.go cmd/nestgo/diagnose.go
          git diff --check
          if [[ -n "$(git status --porcelain -- diagnostics cmd/nestgo)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add diagnostics cmd/nestgo
            git commit -m 'style(diagnostics): gofmt subprocess and scaled report'
            git push origin HEAD:feat/diagnostics-cold-start-and-scale
          fi
