name: Prepare DTO Validation
on:
  push:
    branches: [feat/dto-property-transformers]
    paths:
      - '.github/workflows/validation-format.yml'
permissions:
  contents: write
jobs:
  tidy-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dto-property-transformers
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Update module checksums and format generated support
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          gofmt -w validation/*.go compiler/*.go httpadapter/*.go runtime/http_routes.go runtime/http_validation_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum validation compiler httpadapter runtime/http_routes.go runtime/http_validation_test.go
          if ! git diff --cached --quiet; then
            git commit -m "chore(validation): tidy dependencies and gofmt typed rules"
            git push origin HEAD:feat/dto-property-transformers
          fi
