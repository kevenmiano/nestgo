name: Format code-first regression tests
on:
  push:
    branches: [feat/runtime-code-first-server]
    paths: [runtime/code_first_test.go]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-code-first-server
      - name: gofmt
        run: |
          gofmt -w runtime/code_first_test.go runtime/application.go runtime/http_routes.go
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add runtime/code_first_test.go runtime/application.go runtime/http_routes.go
            git commit -m "style(runtime): format code-first HTTP regression tests"
            git push origin HEAD:feat/runtime-code-first-server
          fi
