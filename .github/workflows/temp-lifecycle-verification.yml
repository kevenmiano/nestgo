name: Temporary lifecycle formatting and test
on:
  push:
    branches: [fix/lifecycle-dependency-order-119]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lifecycle-dependency-order-119
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format implementation and tests
        run: |
          gofmt -w runtime/provider_order.go runtime/provider_order_test.go runtime/bootstrap_core.go runtime/lifecycle.go runtime/application.go
      - name: Commit gofmt before verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/
          if ! git diff --cached --quiet; then
            git commit -m "style(runtime): format dependency lifecycle ordering"
            git push origin HEAD:fix/lifecycle-dependency-order-119
          fi
      - name: Unit, integration, race, vet and benchmarks
        run: |
          go test ./... -count=1
          go test -race ./runtime/... -count=1 -timeout=15m
          go vet ./...
          go test ./runtime -run '^$' -bench '^BenchmarkApplicationBootstrapProviders$' -benchtime=100ms -benchmem
