name: Resolve HTTP adapter module checksums
on:
  push:
    branches: [feat/pluggable-http-engines]
    paths:
      - .github/workflows/tidy-pr49.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pluggable-http-engines
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate verified module checksums
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code -- go.mod || true
      - name: Commit dependency lockfile
        run: |
          if test -n "$(git status --porcelain -- go.mod go.sum)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add go.mod go.sum
            git commit -m 'build: resolve verified fasthttp module checksums'
            git push origin HEAD:feat/pluggable-http-engines
          fi
