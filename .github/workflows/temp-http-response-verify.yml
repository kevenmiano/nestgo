name: HTTP response branch verification
on:
  push:
    branches: [feat/http-response-contract]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go tests and static analysis
        run: |
          go test ./...
          go vet ./...
      - name: Verify gofmt and generated examples
        run: |
          unformatted="$(gofmt -l httpresponse/response.go httpresponse/response_test.go metadata/registry.go platform/fasthttp/adapter.go platform/nethttp/adapter.go compiler/compiler.go compiler/lexer.go compiler/response_decorators.go compiler/response_decorators_test.go runtime/http_routes.go runtime/http_response.go runtime/runtime.go runtime/http_response_integration_test.go runtime/http_static_adapter_test.go examples/shop/zz_modforge_metadata.go)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
          go run ./cmd/modforge compile ./examples/shop
          git diff --exit-code -- examples/shop
