name: Gatling HTTP E2E performance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'performance/gatling/**'
      - 'cmd/perfserver/**'
      - '.github/workflows/gatling-e2e.yml'

permissions:
  contents: read

jobs:
  smoke-load:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build server
        run: go build -o /tmp/nestgo-perf-server ./cmd/perfserver
      - name: Install Gatling JS SDK
        working-directory: performance/gatling
        run: npm install --no-audit --no-fund
      - name: Compare identical HTTP endpoint across both runtimes
        working-directory: performance/gatling
        env:
          NESTGO_BASE_URL: http://127.0.0.1:18080
          NESTGO_RATE: '10'
          NESTGO_DURATION: '20'
          NESTGO_WARMUP: '10'
        run: |
          set -euo pipefail
          mkdir -p results
          for mode in nethttp nestgo; do
            /tmp/nestgo-perf-server -mode="$mode" > "results/server-$mode.log" 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            ready=0
            for i in $(seq 1 50); do
              if curl -fsS http://127.0.0.1:18080/users/ >/dev/null; then ready=1; break; fi
              sleep 0.2
            done
            if [ "$ready" != 1 ]; then cat "results/server-$mode.log"; exit 1; fi
            npm run test:load
            mkdir -p "results/$mode"
            if [ -d target/gatling ]; then cp -R target/gatling "results/$mode/"; fi
            kill "$pid"
            wait "$pid" || true
            trap - EXIT
            rm -rf target/gatling
            sleep 1
          done
      - name: Upload HTML reports and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-nestgo-e2e-${{ github.sha }}
          path: |
            performance/gatling/target/gatling/
            performance/gatling/*.log
          if-no-files-found: warn
