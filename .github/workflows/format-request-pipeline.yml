name: One-time request pipeline formatting

on:
  push:
    branches: [feat/http-request-pipeline]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format modified Go files
        run: |
          gofmt -w compiler/compiler.go compiler/http_pipeline_metadata.go compiler/http_pipeline_metadata_test.go compiler/typed_http_test.go httpadapter/binding.go httpadapter/pipeline.go metadata/registry.go runtime/application.go runtime/http_routes.go runtime/request_pipeline.go runtime/http_pipeline_test.go runtime/http_static_adapter_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/ httpadapter/ metadata/ runtime/
          if ! git diff --cached --quiet; then
            git commit -m "style(go): format request pipeline changes"
            git push origin HEAD:feat/http-request-pipeline
          fi
      - name: Regenerate compiler example metadata
        run: |
          go run ./cmd/modforge compile ./examples/shop
          git add examples/shop/
          if ! git diff --cached --quiet; then
            git commit -m "chore(compiler): regenerate shop typed HTTP dispatch"
            git push origin HEAD:feat/http-request-pipeline
          fi
