name: One-time pipeline reformat

on:
  push:
    branches: [feat/http-request-pipeline]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reformat merged HTTP pipeline and tests
        run: |
          gofmt -w runtime/http_routes.go runtime/http_pipeline_code_first_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/http_routes.go runtime/http_pipeline_code_first_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style(http): gofmt code-first integration and tests"
            git push origin HEAD:feat/http-request-pipeline
          fi
