name: HTTP performance benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'httpadapter/**'
      - 'platform/**'
      - '.github/workflows/http-benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: HTTP invocation and adapter benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify benchmark tests
        run: go test ./runtime -run 'TestAdapterStaticInvocationAndDynamicFallback|TestHTTPAdapterConformance' -count=1
      - name: Measure HTTP invocation and engine workloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          go version | tee benchmark-results/environment.txt
          uname -a | tee -a benchmark-results/environment.txt
          GOMAXPROCS=2 go test ./runtime -run '^$' -bench 'BenchmarkHTTPInvocation|BenchmarkHTTPEngines|BenchmarkAdapterBootstrap|BenchmarkAdapterConcurrency' -benchtime=200ms -benchmem -count=3 -timeout=12m | tee benchmark-results/http.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-benchmarks-${{ github.sha }}
          path: benchmark-results/
          retention-days: 30
