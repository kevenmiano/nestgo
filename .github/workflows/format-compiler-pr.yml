name: Format compiler coverage PR

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'compiler/compiler.go'
      - 'compiler/coverage_test.go'
      - '.github/workflows/format-compiler-pr.yml'

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == 'kevenmiano/nestgo' && github.event.pull_request.head.ref == 'test/phase-1-compiler-coverage' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/phase-1-compiler-coverage
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed compiler files
        run: |
          gofmt -w compiler/compiler.go compiler/coverage_test.go
          git diff --check
          if git diff --quiet -- compiler/compiler.go compiler/coverage_test.go; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/compiler.go compiler/coverage_test.go
          git commit -m "style(compiler): apply gofmt"
          git push origin HEAD:test/phase-1-compiler-coverage
