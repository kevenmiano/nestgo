name: Format shared DI
on:
  push:
    branches: [docs/runtime-lifecycle-mermaid]
    paths: [runtime/inject.go]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/runtime-lifecycle-mermaid
      - run: |
          gofmt -w runtime/inject.go runtime/runtime.go runtime/http_routes.go
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add runtime/inject.go runtime/runtime.go runtime/http_routes.go
            git commit -m "style(runtime): gofmt shared DI changes"
            git push origin HEAD:docs/runtime-lifecycle-mermaid
          fi
