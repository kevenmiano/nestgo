name: Generate pipeline sample and validate

on:
  push:
    branches: [feat/http-request-pipeline]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile .mgo example to ordinary Go
        run: go run ./cmd/modforge compile ./examples/pipeline
      - name: Format and test compiled example
        run: |
          gofmt -w examples/pipeline/pipeline_test.go examples/pipeline/cmd/server/main.go
          go test ./examples/pipeline/... -count=1 -v
          go vet ./examples/pipeline/...
      - name: Commit the generated files and Go formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/pipeline/
          if ! git diff --cached --quiet; then
            git commit -m 'test(examples): check in generated pipeline sample'
            git push origin HEAD:feat/http-request-pipeline
          fi
