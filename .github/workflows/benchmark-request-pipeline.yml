name: Measure request pipeline overhead

on:
  push:
    branches: [feat/http-request-pipeline]

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format and verify benchmark
        run: |
          gofmt -w runtime/http_pipeline_bench_test.go
          go test ./runtime -run '^TestRequestPipeline' -count=1
      - name: Measure isolated pipeline overhead (five samples)
        shell: bash
        run: |
          set -euo pipefail
          go version
          GOMAXPROCS=2 go test ./runtime -run '^$' -bench '^BenchmarkRequestPipeline$' -benchtime=300ms -count=5 -benchmem -timeout=12m | tee /tmp/pipeline-bench.txt
          python3 - <<'PY'
          import re, statistics
          lines=open('/tmp/pipeline-bench.txt').read().splitlines()
          pattern=re.compile(r'^BenchmarkRequestPipeline/(.+?)-\d+\s+\d+\s+([\d.]+) ns/op\s+(\d+) B/op\s+(\d+) allocs/op')
          groups={}
          for line in lines:
              m=pattern.match(line)
              if m:
                  groups.setdefault(m.group(1),[]).append((float(m.group(2)),int(m.group(3)),int(m.group(4))))
          if not groups or any(len(v)!=5 for v in groups.values()):
              raise SystemExit('expected five samples per scenario; found '+str({k:len(v) for k,v in groups.items()}))
          base=statistics.median(x[0] for x in groups['baseline/static'])
          print('\n| Scenario | Median ns/op | vs. baseline | B/op | allocs/op |')
          print('|---|---:|---:|---:|---:|')
          for name, samples in groups.items():
              ns,b,alloc=(statistics.median(row[i] for row in samples) for i in range(3))
              print(f'| {name} | {ns:.1f} | {(ns/base-1)*100:+.1f}% | {b:.0f} | {alloc:.0f} |')
          PY
      - name: Persist benchmark fixture formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/http_pipeline_bench_test.go
          if ! git diff --cached --quiet; then
            git commit -m 'style(runtime): format isolated pipeline benchmarks'
            git push origin HEAD:feat/http-request-pipeline
          fi
