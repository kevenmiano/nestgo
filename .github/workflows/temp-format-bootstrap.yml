name: Format bootstrap and HTTP changes
on:
  push:
    branches: [docs/runtime-lifecycle-mermaid]
    paths: [runtime/bootstrap_benchmark_test.go]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/runtime-lifecycle-mermaid
      - run: |
          gofmt -w platform/fasthttp/adapter.go runtime/bootstrap_metrics.go runtime/application.go runtime/application_test.go runtime/http_adapter_integration_test.go runtime/bootstrap_benchmark_test.go
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add platform/fasthttp/adapter.go runtime/bootstrap_metrics.go runtime/application.go runtime/application_test.go runtime/http_adapter_integration_test.go runtime/bootstrap_benchmark_test.go
            git commit -m "style(runtime): gofmt bootstrap metrics and route matching"
            git push origin HEAD:docs/runtime-lifecycle-mermaid
          fi
