name: Format DTO contract change
on:
  push:
    branches: [feat/dto-property-transformers]
    paths:
      - '.github/workflows/pr-dto-contract-gofmt.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dto-property-transformers
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - shell: bash
        run: |
          set -euo pipefail
          gofmt -w compiler/property_decorators.go compiler/property_decorators_test.go compiler/property_source.go compiler/property_transform_contract_test.go transform/contract.go transform/contract_test.go transform/transform.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler transform
          if ! git diff --cached --quiet; then
            git commit -m "style(dto): format transformer contract implementation"
            git push origin HEAD:feat/dto-property-transformers
          fi
