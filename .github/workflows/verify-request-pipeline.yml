name: Verify request pipeline branch

on:
  push:
    branches: [feat/http-request-pipeline]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./runtime ./httpadapter ./compiler
      - name: Check formatting and generated metadata
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z origin/main...HEAD -- '*.go')
          if (( ${#files[@]} > 0 )); then
            test -z "$(gofmt -l "${files[@]}")"
          fi
          go run ./cmd/modforge compile ./examples/shop
          git diff --exit-code -- examples/shop
