name: Format real-app diagnostics (temporary)
on:
  push:
    branches: [feat/diagnostics-real-app-metadata]
    paths: ['.github/workflows/format-real-app-temporary.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/diagnostics-real-app-metadata
      - name: Apply gofmt to new source
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w diagnostics/registered.go cmd/nestgo/app.go cmd/nestgo/diagnose.go
          git diff --check
          if [[ -n "$(git status --porcelain -- diagnostics cmd/nestgo)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add diagnostics cmd/nestgo
            git commit -m 'style(diagnostics): standardize real app inspection code'
            git push origin HEAD:feat/diagnostics-real-app-metadata
          fi
