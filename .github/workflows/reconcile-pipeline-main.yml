name: Reconcile compiled pipeline with latest main
on:
  push:
    branches: [feat/http-request-pipeline]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format merged Go source
        run: |
          gofmt -w compiler/compiler.go metadata/registry.go runtime/application.go runtime/http_routes.go runtime/request_pipeline.go runtime/http_pipeline_test.go
      - name: Regenerate examples with merged compiler
        run: |
          go run ./cmd/modforge compile ./examples/shop
          go run ./cmd/modforge compile ./examples/pipeline
          gofmt -w examples/pipeline/cmd/server/main.go examples/pipeline/pipeline_test.go
      - name: Save formatted and generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler/compiler.go metadata/registry.go runtime/application.go runtime/http_routes.go runtime/request_pipeline.go runtime/http_pipeline_test.go examples/shop examples/pipeline
          if ! git diff --cached --quiet; then
            git commit -m 'fix(integration): format merged runtime and regenerate NestGo metadata'
            git push origin HEAD:feat/http-request-pipeline
          fi
      - name: Verify tests and diagnostics
        run: |
          go test ./... -count=1
          go vet ./...
      - name: Verify pipeline race safety
        run: go test -race ./runtime ./httpadapter ./examples/pipeline/...
