name: PR132 Merge Conflict Inspection
on:
  push:
    branches: [feat/dto-property-transformers]
    paths:
      - '.github/workflows/pr132-merge-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect merge into main
        shell: bash
        run: |
          git fetch origin main
          git config user.name "NestGo Integration"
          git config user.email "actions@users.noreply.github.com"
          echo "::group::Branches"
          git rev-parse HEAD origin/main
          echo "::endgroup::"
          git merge --no-commit --no-ff origin/main || true
          echo "::group::Conflicted files"
          git diff --name-only --diff-filter=U
          echo "::endgroup::"
          echo "::group::Unmerged blocks"
          for file in $(git diff --name-only --diff-filter=U); do
            echo "FILE: $file"
            grep -n -C 7 -E '^(<<<<<<<|=======|>>>>>>>)' "$file" | head -350 || true
          done
          echo "::endgroup::"
          git merge --abort || true
