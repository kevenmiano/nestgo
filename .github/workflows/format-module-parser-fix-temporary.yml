name: Format module parser follow-up (temporary)
on:
  push:
    branches: [feat/nestjs-style-module-lists]
    paths: ['.github/workflows/format-module-parser-fix-temporary.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nestjs-style-module-lists
      - name: Format changed parser
        run: |
          set -euo pipefail
          gofmt -w compiler/module_options.go
          if [[ -n "$(git status --porcelain -- compiler/module_options.go)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add compiler/module_options.go
            git commit -m 'style(compiler): normalize module parser follow-up'
            git push origin HEAD:feat/nestjs-style-module-lists
          fi
