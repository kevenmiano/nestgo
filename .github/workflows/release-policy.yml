name: Release policy and CLI checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmd/nestgo/**'
      - '.goreleaser.yaml'
      - '.github/scripts/verify-release-tag.sh'
      - '.github/workflows/framework-release.yml'
      - '.github/workflows/go-packages.yml'
      - '.github/workflows/docs-release.yml'
      - '.github/workflows/release-policy.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/nestgo/**'
      - '.goreleaser.yaml'
      - '.github/scripts/verify-release-tag.sh'
      - '.github/workflows/framework-release.yml'
      - '.github/workflows/go-packages.yml'
      - '.github/workflows/docs-release.yml'
      - '.github/workflows/release-policy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate shell syntax and reject invalid release tags
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/verify-release-tag.sh
          for invalid in latest v2.0.0 v1.0 v0.1.0/evil; do
            if bash .github/scripts/verify-release-tag.sh "$invalid"; then
              echo "::error::Unexpectedly accepted $invalid"
              exit 1
            fi
          done

      - name: Verify NestGo CLI can be installed locally
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/bin"
          mkdir -p "$GOBIN"
          go install ./cmd/nestgo
          test -x "$GOBIN/nestgo"
          "$GOBIN/nestgo" compile ./examples/shop
          git diff --exit-code -- examples/shop
          test -z "$(git ls-files --others --exclude-standard -- examples/shop)"

  goreleaser:
    name: Validate GoReleaser config and snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - name: Build snapshot without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Verify archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/checksums.txt
          test -s dist/artifacts.json
          find dist -maxdepth 1 -name '*.tar.gz' -print | grep -q .
          find dist -maxdepth 1 -name '*.zip' -print | grep -q .
