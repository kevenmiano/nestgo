name: HTTP response reconciliation formatter
on:
  push:
    branches: [feat/http-response-contract]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/http-response-contract
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Reformat merged code and regenerate compiler examples
        run: |
          set -euo pipefail
          gofmt -w compiler/compiler.go compiler/lexer.go compiler/response_decorators.go compiler/response_decorators_test.go metadata/registry.go runtime/route_contract.go runtime/http_routes.go runtime/runtime.go runtime/http_response.go runtime/http_response_integration_test.go runtime/http_static_adapter_test.go httpresponse/response.go httpresponse/response_test.go platform/nethttp/adapter.go platform/fasthttp/adapter.go
          go run ./cmd/modforge compile ./examples/shop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(http): format response layer against merged bootstrap"
            git push origin HEAD:feat/http-response-contract
          fi
