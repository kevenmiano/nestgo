name: Format runtime lifecycle
on:
  push:
    branches: [docs/runtime-lifecycle-mermaid]
    paths: [runtime/lifecycle_test.go]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/runtime-lifecycle-mermaid
      - run: |
          gofmt -w runtime/application.go runtime/lifecycle_test.go
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add runtime/application.go runtime/lifecycle_test.go
            git commit -m "style(runtime): format rollback changes"
            git push origin HEAD:docs/runtime-lifecycle-mermaid
          fi
