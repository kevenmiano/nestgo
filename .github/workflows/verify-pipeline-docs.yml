name: Validate NestGo pipeline docs and examples

on:
  push:
    branches: [feat/http-request-pipeline]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: All Go packages
        run: go test ./... -count=1
      - name: Compiler and runtime race safety
        run: go test -race ./examples/pipeline/... ./runtime ./httpadapter
      - name: Static analysis
        run: go vet ./...
      - name: Generated sources are deterministic
        run: |
          go run ./cmd/modforge compile ./examples/pipeline
          go run ./cmd/modforge compile ./examples/shop
          git diff --exit-code -- examples/pipeline examples/shop
      - name: Go formatting
        run: |
          files="$(gofmt -l $(find examples/pipeline -name '*.go'))"
          test -z "$files"
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Docusaurus dependencies
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Build docs (including Mermaid and links)
        working-directory: website
        run: npm run build
