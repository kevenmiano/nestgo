name: Format shared bootstrap
on:
  push:
    branches: [feat/runtime-shared-bootstrap-100]
    paths: [runtime/bootstrap_core.go]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-shared-bootstrap-100
      - name: Format
        run: |
          gofmt -w runtime/bootstrap_core.go runtime/runtime.go runtime/http_routes.go
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add runtime/bootstrap_core.go runtime/runtime.go runtime/http_routes.go
            git commit -m "style(runtime): gofmt shared bootstrap"
            git push origin HEAD:feat/runtime-shared-bootstrap-100
          fi
