name: DI formatting diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/inject_contract_p0_test.go'
      - 'compiler/dependency_validation_test.go'
      - '.github/workflows/di-format-diff.yml'
permissions:
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -d runtime/inject_contract_p0_test.go compiler/dependency_validation_test.go
