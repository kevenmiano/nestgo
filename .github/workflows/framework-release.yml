name: NestGo framework — GoReleaser

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published release tag (v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nestgo-framework-release
  cancel-in-progress: false

jobs:
  release-cli:
    name: Verify and publish NestGo CLI with GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is from main
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          bash .github/scripts/verify-release-tag.sh "$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test released source
        run: |
          go test ./...
          go vet ./...

      - name: Smoke-test versioned Go installation
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GOPROXY: direct
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nestgo-bin"
          GOBIN="$RUNNER_TEMP/nestgo-bin" go install "github.com/kevenmiano/nestgo/cmd/nestgo@$RELEASE_TAG"
          GOBIN="$RUNNER_TEMP/nestgo-bin" go install "github.com/kevenmiano/nestgo/cmd/modforge@$RELEASE_TAG"
          test -x "$RUNNER_TEMP/nestgo-bin/nestgo"
          test -x "$RUNNER_TEMP/nestgo-bin/modforge"
          "$RUNNER_TEMP/nestgo-bin/nestgo" compile ./examples/shop
          git diff --exit-code -- examples/shop
          test -z "$(git ls-files --others --exclude-standard -- examples/shop)"

      - name: Release archives and checksums with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
