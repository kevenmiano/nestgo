name: NestGo framework — CLI release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published release tag (v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nestgo-framework-release
  cancel-in-progress: false

jobs:
  release-cli:
    name: Install CLI and build platform binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is from main
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          bash .github/scripts/verify-release-tag.sh "$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test framework from the released commit
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/nestgo ./cmd/modforge

      - name: Smoke-test go install with the versioned module
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GOPROXY: direct
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nestgo-bin"
          GOBIN="$RUNNER_TEMP/nestgo-bin" go install "github.com/kevenmiano/nestgo/cmd/nestgo@$RELEASE_TAG"
          GOBIN="$RUNNER_TEMP/nestgo-bin" go install "github.com/kevenmiano/nestgo/cmd/modforge@$RELEASE_TAG"
          test -x "$RUNNER_TEMP/nestgo-bin/nestgo"
          test -x "$RUNNER_TEMP/nestgo-bin/modforge"
          "$RUNNER_TEMP/nestgo-bin/nestgo" compile ./examples/shop
          git diff --exit-code -- examples/shop
          test -z "$(git ls-files --others --exclude-standard -- examples/shop)"
          echo "go install works for the released version $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Build downloadable CLI binaries
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%%/*}"
            GOARCH="${target##*/}"
            suffix=""
            if [[ "$GOOS" == "windows" ]]; then suffix=".exe"; fi
            output="dist/nestgo_${RELEASE_TAG}_${GOOS}_${GOARCH}${suffix}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" -o "$output" ./cmd/nestgo
          done
          (cd dist && sha256sum nestgo_* > SHA256SUMS.txt)

      - name: Attach CLI binaries to the existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "CLI assets uploaded for $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
