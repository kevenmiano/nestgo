name: HTTP generic contract format and integration
on:
  push:
    branches: [feat/http-response-contract]
permissions:
  contents: write
jobs:
  verify-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/http-response-contract
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format modified Go files and regenerate example
        run: |
          set -euo pipefail
          gofmt -w http/response.go http/response_test.go             runtime/http_response.go runtime/http_response_integration_test.go             runtime/http_routes.go runtime/route_contract.go             runtime/route_contract_fuzz_test.go runtime/p0_route_contract_test.go             runtime/http_static_adapter_test.go             compiler/compiler.go compiler/lexer.go compiler/response_decorators.go             compiler/response_decorators_test.go metadata/registry.go             platform/fasthttp/adapter.go platform/nethttp/adapter.go
          go run ./cmd/modforge compile ./examples/shop
      - name: Run tests and static analysis
        run: |
          go test ./...
          go vet ./...
      - name: Publish formatting changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(http): format generic response contract and regenerate examples"
            git push origin HEAD:feat/http-response-contract
          fi
