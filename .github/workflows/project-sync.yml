name: Sync NestGo issues to GitHub Project

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      backfill:
        description: "Import all open repository issues into Project #2"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'issues' || github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync issue and PR status
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: kevenmiano
          PROJECT_NUMBER: "2"
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const owner = process.env.PROJECT_OWNER;
            const number = Number(process.env.PROJECT_NUMBER);
            const repo = context.repo;
            const projectData = await github.graphql(`
              query($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                  }
                }
              }`, {login: owner, number});
            const project = projectData.user?.projectV2;
            if (!project) throw new Error('Project #2 was not found or token cannot access it');
            const statusField = project.field;
            if (!statusField?.options) throw new Error('Project requires a single-select Status field');
            const getStatus = (name) => statusField.options.find(o => o.name.toLowerCase() === name.toLowerCase())?.id;
            const add = async (issue, statusName) => {
              const result = await github.graphql(`
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                    item { id }
                  }
                }`, {project: project.id, content: issue.node_id});
              const itemId = result.addProjectV2ItemById.item.id;
              const optionId = getStatus(statusName);
              if (!optionId) {
                core.warning(`Status "${statusName}" not found; item added without changing status`);
                return;
              }
              await github.graphql(`
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $field,
                    value: {singleSelectOptionId: $option}
                  }) { projectV2Item { id } }
                }`, {project: project.id, item: itemId, field: statusField.id, option: optionId});
              core.info(`Synced issue #${issue.number} → ${statusName}`);
            };
            if (context.eventName === 'workflow_dispatch') {
              if (context.payload.inputs?.backfill === 'false') return;
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                ...repo, state: 'open', per_page: 100
              });
              for (const issue of issues.filter(i => !i.pull_request)) {
                await add(issue, 'Backlog');
              }
              return;
            }
            if (context.eventName === 'issues') {
              await add(context.payload.issue, 'Backlog');
              return;
            }
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const issueNumbers = [...new Set([...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s+#(\d+)/gi)].map(m => Number(m[1])))];
            if (!issueNumbers.length) {
              core.info('PR body does not reference local issues with Closes/Fixes/Resolves/Refs #N');
              return;
            }
            const status = pr.merged ? 'Done' : pr.state === 'closed' ? 'Backlog' : 'In Review';
            for (const issueNumber of issueNumbers) {
              const {data: issue} = await github.rest.issues.get({...repo, issue_number: issueNumber});
              if (issue.pull_request) continue;
              await add(issue, status);
            }
