name: Sync NestGo issues to GitHub Project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-sync.yml'
      - '.github/scripts/project-sync-logic.cjs'
  issues:
    types: [opened, reopened, edited, closed, labeled, unlabeled, milestoned, demilestoned]
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      backfill:
        description: "Reconcile issue metadata into Project #2 without resetting statuses"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request_target must never check out untrusted PR head code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Synchronize issue metadata and status
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: kevenmiano
          PROJECT_NUMBER: "2"
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const { parseMetadata, parsePrReferences, issueStatus, prStatus, resolveStatusOption } =
              require('./.github/scripts/project-sync-logic.cjs');
            const owner = process.env.PROJECT_OWNER;
            const number = Number(process.env.PROJECT_NUMBER);
            const repo = context.repo;
            const definitions = {
              Priority: ["P0", "P1", "P2"],
              Roadmap: ["M001", "M002", "M003", "M004", "M005", "M006"]
            };
            const projectData = await github.graphql(`
              query($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2FieldCommon { id name dataType }
                        ... on ProjectV2SingleSelectField { options { id name } }
                      }
                    }
                  }
                }
              }`, {login: owner, number});
            const project = projectData.user?.projectV2;
            if (!project) throw new Error("Project not found or token lacks project permission");
            const fields = new Map(project.fields.nodes.filter(Boolean).map(f => [f.name, f]));
            if (!fields.get("Status")?.options) throw new Error("Project requires a single-select Status field");
            core.info("Available Project Status options: " + fields.get("Status").options.map(o => o.name).join(", "));
            
            for (const [name, values] of Object.entries(definitions)) {
              if (fields.has(name)) {
                if (!fields.get(name).options) throw new Error(name + " must be a single-select field");
                for (const value of values) {
                  if (!fields.get(name).options.some(o => o.name === value)) {
                    throw new Error(name + " is missing option " + value + "; configure the field once in Project settings");
                  }
                }
                continue;
              }
              const created = await github.graphql(`
                mutation($project: ID!, $name: String!, $options: [ProjectV2SingleSelectFieldOptionInput!]!) {
                  createProjectV2Field(input: {
                    projectId: $project, name: $name, dataType: SINGLE_SELECT,
                    singleSelectOptions: $options
                  }) {
                    projectV2Field {
                      ... on ProjectV2SingleSelectField { id name options { id name } }
                    }
                  }
                }`, {
                project: project.id, name,
                options: values.map(v => ({name: v, color: "GRAY", description: v}))
              });
              fields.set(name, created.createProjectV2Field.projectV2Field);
            }
            const getOption = (fieldName, value) =>
              fields.get(fieldName)?.options?.find(o => o.name.toLowerCase() === value.toLowerCase())?.id;
            const updateSelect = async (item, fieldName, value) => {
              if (!value) return;
              const field = fields.get(fieldName);
              const resolved = fieldName === "Status"
                ? resolveStatusOption(value, field.options)
                : field.options?.find(o => o.name.toLowerCase() === value.toLowerCase());
              if (!resolved) {
                if (fieldName === "Status") {
                  core.warning("Status " + value + " unavailable; preserving existing status.");
                  return;
                }
                throw new Error("Missing " + fieldName + " option " + value);
              }
              if (fieldName === "Status" && resolved.name !== value) {
                core.info("Mapping Status " + value + " to existing option " + resolved.name);
              }
              const option = resolved.id;
              await github.graphql(`
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $field,
                    value: {singleSelectOptionId: $option}
                  }) { projectV2Item { id } }
                }`, {project: project.id, item, field: field.id, option});
            };
            const sync = async (issue, status) => {
              if (issue.pull_request) return;
              const result = await github.graphql(`
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                    item { id }
                  }
                }`, {project: project.id, content: issue.node_id});
              const item = result.addProjectV2ItemById.item.id;
              const metadata = parseMetadata(issue.body);
              if (status) await updateSelect(item, "Status", status);
              await updateSelect(item, "Priority", metadata.priority);
              await updateSelect(item, "Roadmap", metadata.milestone);
              core.info("Synced #" + issue.number + " " + JSON.stringify(metadata) + (status ? " status=" + status : ""));
            };
            if (context.eventName === "workflow_dispatch" || context.eventName === "push") {
              if (context.eventName === "workflow_dispatch" && context.payload.inputs?.backfill === "false") return;
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                ...repo, state: "all", per_page: 100
              });
              for (const issue of issues.filter(i => !i.pull_request)) {
                // Reconcile metadata without overwriting the workflow status of existing items.
                await sync(issue, null);
              }
            } else if (context.eventName === "issues") {
              const issue = context.payload.issue;
              await sync(issue, issueStatus(context.payload.action, issue.state));
            } else {
              const pr = context.payload.pull_request;
              const references = parsePrReferences(pr.body);
              const hasInProgress = Boolean(resolveStatusOption("In Progress", fields.get("Status").options));
              for (const [issue_number, closes] of references) {
                const {data: issue} = await github.rest.issues.get({...repo, issue_number});
                const status = prStatus({
                  issueState: issue.state,
                  prState: pr.state,
                  merged: pr.merged,
                  draft: pr.draft,
                  closes,
                  hasInProgress
                });
                await sync(issue, status);
              }
            }

