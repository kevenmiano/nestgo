name: Format compiler module decorators (temporary)
on:
  push:
    branches: [feat/compiler-module-import-export-decorators]
    paths: ['.github/workflows/format-module-decorators-temporary.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-module-import-export-decorators
      - name: Run gofmt on changed compiler sources
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w compiler/compiler.go compiler/module_decorators_test.go
          git diff --check
          if [[ -n "$(git status --porcelain -- compiler)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add compiler/compiler.go compiler/module_decorators_test.go
            git commit -m 'style(compiler): apply gofmt to module decorator compiler'
            git push origin HEAD:feat/compiler-module-import-export-decorators
          fi
