name: Format diagnostics source (temporary)

on:
  push:
    branches: [feat/diagnostics-startup-report]
    paths:
      - '.github/workflows/format-diagnostics-temporary.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'kevenmiano/nestgo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/diagnostics-startup-report
          persist-credentials: true
      - name: gofmt all new diagnostics and CLI files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w diagnostics/*.go cmd/nestgo/main.go cmd/nestgo/diagnose.go
          git diff --check
          if [[ -n "$(git status --porcelain -- diagnostics cmd/nestgo)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add diagnostics cmd/nestgo
            git commit -m 'style(diagnostics): apply gofmt to graph and report sources'
            git push origin HEAD:feat/diagnostics-startup-report
          fi
